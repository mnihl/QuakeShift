apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: quakeshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.10.0
          args: ["--kafka.server=kafka:9092"]
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            tcpSocket:
              port: metrics
