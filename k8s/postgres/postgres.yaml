apiVersion: v1
kind: Secret
metadata:
  name: postgres-local
  namespace: quakeshift
stringData:
  POSTGRES_PASSWORD: quakeshift
  POSTGRES_DSN: postgresql://quakeshift:quakeshift@postgres.quakeshift.svc:5432/quakeshift
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quakeshift
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: quakeshift
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.12-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: quakeshift
            - name: POSTGRES_USER
              value: quakeshift
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, quakeshift, -d, quakeshift]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
