apiVersion: apps/v1
kind: Deployment
metadata:
  name: associator
  namespace: quakeshift
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: associator
  template:
    metadata:
      labels:
        app: associator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: associator
          image: quakeshift-associator:local
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.quakeshift.svc:9092
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_DSN
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
